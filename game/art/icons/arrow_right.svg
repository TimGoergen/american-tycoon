<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Right-pointing twin of arrow_left.svg, marking the AUTO-BUY button's EXPANDED state: the
       button now spans the row, and this edge is where it would collapse back to. Mirrored path,
       identical weight, so the two read as one control changing direction rather than two icons. -->
  <path d="M50 20 L42 28 L78 64 L42 100 L50 108 L94 64 Z"
        fill="#1D2D50" stroke="#1D2D50" stroke-width="6" stroke-linejoin="round"/>
</svg>
