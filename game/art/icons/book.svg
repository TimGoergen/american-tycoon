<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E7D3A"/>
      <stop offset="100%" stop-color="#2C5E2A"/>
    </linearGradient>
  </defs>
  <!-- Page block edge peeking out on the right/bottom (cream stacked pages) -->
  <rect x="26" y="16" width="80" height="96" rx="8" fill="#F3ECD8" stroke="#1C3A1B" stroke-width="4"/>
  <!-- Main hardcover front, offset left so pages show on the right -->
  <rect x="20" y="12" width="80" height="96" rx="8" fill="url(#bookCover)" stroke="#1C3A1B" stroke-width="4"/>
  <!-- Spine shading stripe on the left -->
  <rect x="28" y="12" width="8" height="96" fill="#1C3A1B" opacity="0.25"/>
  <!-- Gold horizontal ledger band -->
  <rect x="20" y="52" width="80" height="12" fill="#E3B23C" stroke="#8A5A12" stroke-width="2"/>
  <!-- Small gold bookmark ribbon hanging from the top -->
  <polygon points="78,12 92,12 92,44 85,37 78,44" fill="#E3B23C" stroke="#8A5A12" stroke-width="2" stroke-linejoin="round"/>
</svg>
