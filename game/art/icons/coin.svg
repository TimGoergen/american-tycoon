<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="coinGold" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#F6D479"/>
      <stop offset="55%" stop-color="#E3B23C"/>
      <stop offset="100%" stop-color="#B8801F"/>
    </radialGradient>
  </defs>
  <!-- Outer dark outline + darker gold rim ring -->
  <circle cx="64" cy="64" r="52" fill="#8A5A12"/>
  <circle cx="64" cy="64" r="48" fill="url(#coinGold)" stroke="#B8801F" stroke-width="4"/>
  <!-- $ sign drawn as vector shapes in dark gold/brown -->
  <g fill="#8A5A12">
    <!-- vertical bar through the S -->
    <rect x="60" y="30" width="8" height="68" rx="4"/>
    <!-- S curve of the dollar sign built from a stroked path -->
    <path d="M78 46 C78 36 68 34 60 34 C50 34 44 40 44 48 C44 57 53 60 64 63 C75 66 84 69 84 79 C84 88 76 94 64 94 C54 94 46 91 46 81"
          fill="none" stroke="#8A5A12" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
