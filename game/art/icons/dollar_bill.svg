     y="1.89247"
     width="78.883842"
     height="53.67939"
     rx="7"
     fill="#2e7d4f"
     stroke="#d4af37"
     stroke-width="3.78494"
     id="rect1"
     ry="7"
     style="stroke:#153a25;stroke-opacity:1" />
  <!-- Inner gold guilloche frame -->
  <rect
     x="6.7412934"
     y="7.4847875"
     width="69.186203"
     height="42.346054"
     rx="4"
     fill="none"
     stroke="#d4af37"
     stroke-width="2"
     id="rect2"
     ry="4"
     style="stroke:#e9d622;stroke-opacity:1" />
  <!-- Corner pips (gold) -->
  <circle
     cx="12.91432"
     cy="13.657814"
     r="3"
     fill="#d4af37"
     id="circle2"
     style="fill:#e9d622;fill-opacity:1" />
  <circle
