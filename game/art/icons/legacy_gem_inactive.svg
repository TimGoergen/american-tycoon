     inkscape:window-maximized="1"
     inkscape:current-layer="svg22" />
  <!-- "Legacy gem" — INACTIVE (black-and-white) tab version: the same faceted crystal as the
       colored active gem, but every facet is forced white via a style="fill:#ffffff" override so
       only the black facet borders read, giving a line-art silhouette. The purple gradient <defs>
       below are inert leftovers from the colored version (kept so the two files stay diff-able);
       nothing references them anymore. Note: the two side facets set fill="#ffffff" DIRECTLY rather
       than via style override, because Godot's thorvg importer renders a fill="url(#gradient)"
       presentation attribute instead of honoring the style override (which strict SVG says wins) —
       that mismatch was what left purple panels on the sides. No SVG filters (thorvg ignores them). -->
  <defs
     id="defs10">
    <radialGradient
       id="radialGradient14"
       cx="232.83078"
       cy="74.563751"
       r="69.268173"
       gradientTransform="matrix(-0.35641671,-0.03602327,0.08160575,-1.8049274,166.27058,270.28736)"
       fx="232.83078"
       fy="74.563751"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffd6f6"
         id="stop11"
         style="stop-color:#ffffff;stop-opacity:1;" />
      <stop
         offset="0.22"
         stop-color="#ff58e2"
         id="stop12"
         style="stop-color:#ffffff;stop-opacity:1;" />
      <stop
         offset="0.55000001"
         stop-color="#cf2fbe"
         id="stop13"
         style="stop-color:#ffffff;stop-opacity:1;" />
      <stop
         offset="1"
         stop-color="#7d279a"
         id="stop14"
         style="stop-color:#ffffff;stop-opacity:1;" />
    </radialGradient>
    <linearGradient
       id="linearGradient25"
       x1="0"
       y1="0"
       x2="1"
       y2="0">
      <stop
         offset="0"
         stop-color="#511f78"
         id="stop25" />
      <stop
         offset="1"
         stop-color="#511f78"
         id="stop23"
         style="stop-color:#c72ebb;stop-opacity:1;" />
    </linearGradient>
    <radialGradient
       id="lg_core"
       cx="232.83078"
       cy="74.563751"
       r="69.268173"
       gradientTransform="matrix(-0.35641671,-0.03602327,0.08160575,-1.8049274,166.27058,270.28736)"
       fx="232.83078"
       fy="74.563751"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffd6f6"
         id="stop1" />
      <stop
         offset="0.22"
         stop-color="#ff58e2"
         id="stop2" />
      <stop
         offset="0.55"
         stop-color="#cf2fbe"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#7d279a"
         id="stop4" />
    </radialGradient>
    <linearGradient
       id="lg_center"
       x1="164.64503"
       y1="9.7760496"
       x2="164.64503"
       y2="99.370872"
       gradientTransform="matrix(-0.28869434,0,0,-2.3375703,170.60481,256.13766)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#8a47b6"
         id="stop5" />
      <stop
         offset="0.5"
         stop-color="#b478e0"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#793aa6"
         id="stop7" />
    </linearGradient>
    <linearGradient
       id="lg_side"
       x1="0"
       y1="0"
       x2="1"
       y2="0">
      <stop
         offset="0"
         stop-color="#511f78"
         id="stop8"
         style="stop-color:#c92ebb;stop-opacity:1;" />
      <stop
         offset="0.5"
         stop-color="#8a44ac"
         id="stop9"
         style="stop-color:#da68d7;stop-opacity:1;" />
      <stop
         offset="1"
         stop-color="#511f78"
         id="stop10" />
    </linearGradient>
    <clipPath
       id="lg_centerclip">
      <polygon
         points="108,180 90,230 72,180 72,70 90,24 108,70 "
         id="polygon10" />
    </clipPath>
  </defs>
  <!-- Black crystal silhouette (the thick outline) -->
  <polygon
     points="72,230 38,172 30,84 70,24 110,24 150,84 142,172 108,230 "
     fill="#1a0820"
     stroke="#0c0410"
     stroke-width="9"
     stroke-linejoin="round"
     id="polygon11"
     transform="matrix(-1.4884682,0,0,-0.99553719,253.93983,253.44019)"
     style="stroke-width:0.8;stroke-dasharray:none;stroke:#000000;stroke-opacity:1;fill:#ffffff;fill-opacity:1" />
  <!-- Facets: tile the gem, each with a dark border stroke (the borders between facets) -->
  <g
     stroke="#1c0a28"
     stroke-width="2.5"
     stroke-linejoin="round"
     id="g18"
     transform="matrix(-1.4884682,0,0,-0.99553719,256.1257,254.99456)"
     style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1">
    <polygon
       points="90,24 72,70 30,84 70,24 "
       fill="#491d63"
       id="polygon12"
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1" />
    <!-- left top -->
    <polygon
       points="72,70 72,180 38,172 30,84 "
       fill="#ffffff"
       id="polygon13"
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1" />
    <!-- left mid -->
    <polygon
       points="72,180 90,230 72,230 38,172 "
       fill="#391450"
       id="polygon14"
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1" />
    <!-- left bottom -->
    <polygon
       points="110,24 150,84 108,70 90,24 "
       fill="#491d63"
       id="polygon15"
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1" />
    <!-- right top -->
    <polygon
       points="150,84 142,172 108,180 108,70 "
       fill="#ffffff"
       id="polygon16"
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1" />
    <!-- right mid -->
    <polygon
       points="108,230 90,230 108,180 142,172 "
       fill="#391450"
       id="polygon17"
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:5.1;stroke-dasharray:none;stroke-opacity:1"
       transform="translate(-1.0489564,0.31366749)" />
    <!-- right bottom -->
    <!-- center -->
  </g>
  <!-- Glowing magenta core, clipped to the central facet -->
  <g
     clip-path="url(#lg_centerclip)"
     id="g19"
     style="stroke-width:37.4;stroke-dasharray:none;fill:#000000;fill-opacity:1;stroke:#ffffff;stroke-opacity:1"
     transform="matrix(-1.0200668,0,0,-0.99553719,211.47143,254.06194)" />
  <!-- Beveled highlights: light lavender along the upper inner facet edges where light catches -->
  <g
     clip-path="url(#lg_centerclip)"
     id="g21"
     style="stroke:#ffffff;stroke-width:0;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1;paint-order:markers stroke fill;stroke-dashoffset:0;fill:#000000;fill-opacity:1"
     transform="matrix(-0.57549711,-0.33206685,0.34224075,-0.59312925,169.47017,253.98408)" />
</svg>
