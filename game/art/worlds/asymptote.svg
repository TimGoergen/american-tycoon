<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The Redshift Receivership — home: Asymptote. Entropy Auditors & The Heat Death Syndicate.
     Cosmic singularity world: gravitational lensing accretion ring, redshift magenta gradient, event horizon shadow.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="singularityCore" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#000000"/>
      <stop offset="0.5"  stop-color="#1a0022"/>
      <stop offset="0.8"  stop-color="#4a004e"/>
      <stop offset="1"    stop-color="#720076"/>
    </radialGradient>
    <radialGradient id="redshiftHalo" cx="104.7" cy="145.6" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.75" stop-color="#ff0055" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ff0055" stop-opacity="0.6"/>
    </radialGradient>
    <clipPath id="singularityGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.95">
    <!-- Redshift Corona Halo -->
    <circle cx="104.7" cy="145.6" r="98" fill="url(#redshiftHalo)"/>

    <!-- Singularity sphere body -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#singularityCore)"
            stroke="#ff007f" stroke-width="2.2" stroke-opacity="0.95"/>

    <g clip-path="url(#singularityGlobe)">
      <!-- Lensed Relativistic Accretion Disk (Upper Warp Arc) -->
      <ellipse cx="104.7" cy="145.6" rx="80" ry="32" fill="none"
               stroke="#ff0055" stroke-width="5.0" opacity="0.85"
               transform="rotate(-15,104.7,145.6)"/>
      <ellipse cx="104.7" cy="145.6" rx="80" ry="32" fill="none"
               stroke="#ffbe0b" stroke-width="2.0" opacity="0.9"
               transform="rotate(-15,104.7,145.6)"/>

      <!-- Pitch-Black Event Horizon Void Core -->
      <circle cx="104.7" cy="145.6" r="38" fill="#000000" stroke="#ff007f" stroke-width="1.8"/>

      <!-- Photon Ring Sparkle -->
      <circle cx="104.7" cy="145.6" r="39.5" fill="none" stroke="#ffffff" stroke-width="1.0" opacity="0.85"/>

      <!-- Fading Asymptote Curves (Decay waves falling in) -->
      <g fill="none" stroke="#ff007f" stroke-width="1.4" opacity="0.65">
        <path d="M25,85 Q65,125 104.7,145.6"/>
        <path d="M185,85 Q145,125 104.7,145.6"/>
        <path d="M25,205 Q65,165 104.7,145.6"/>
        <path d="M185,205 Q145,165 104.7,145.6"/>
      </g>
    </g>

    <!-- Outer Gravitational Distortion Ring -->
    <circle cx="104.7" cy="145.6" r="95" fill="none" stroke="#ffbe0b" stroke-width="1.4" stroke-dasharray="8,6" opacity="0.75"/>
  </g>
</svg>
