<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Vashti Deep-Court — home: Bathyros. Abyssal Ocean & Deep Trenches.
     Deep hadal ocean trench world: bioluminescent lures, deep currents, hydrothermal vents.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="abyssalWater" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0d3b4c"/>
      <stop offset="0.6"  stop-color="#08222e"/>
      <stop offset="1"    stop-color="#030d12"/>
    </radialGradient>
    <radialGradient id="anglerGlow" cx="104.7" cy="115" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="0.5"  stop-color="#00a896" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#028090" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="abyssalGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.90">
    <!-- Abyssal sphere -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#abyssalWater)"
            stroke="#00ffff" stroke-width="1.6" stroke-opacity="0.75"/>

    <g clip-path="url(#abyssalGlobe)">
      <!-- Ocean trench layers -->
      <path d="M12.7,145.6 C45,110 80,180 104.7,140 C130,100 165,175 196.7,145.6 L196.7,237.6 L12.7,237.6 Z"
            fill="#05161f" opacity="0.8"/>
      <path d="M12.7,175.6 C55,150 90,200 104.7,170 C125,140 160,195 196.7,175.6 L196.7,237.6 L12.7,237.6 Z"
            fill="#020a0e"/>

      <!-- Glowing Hadal currents -->
      <g fill="none" stroke="#00a896" stroke-width="1.8" stroke-linecap="round" opacity="0.65">
        <path d="M30,120 Q65,95 105,110 T180,95"/>
        <path d="M25,155 Q75,130 115,150 T185,135"/>
        <path d="M40,190 Q85,170 125,185 T175,170"/>
      </g>

      <!-- Bioluminescent Angler lures -->
      <circle cx="104.7" cy="115" r="40" fill="url(#anglerGlow)"/>
      <g fill="#e0fbfc">
        <circle cx="104.7" cy="115" r="4.5"/>
        <circle cx="68" cy="135" r="3.2"/>
        <circle cx="145" cy="142" r="3.8"/>
        <circle cx="85" cy="175" r="2.8"/>
        <circle cx="130" cy="180" r="3.0"/>
        <circle cx="104.7" cy="198" r="2.4"/>
      </g>

      <!-- Light tendrils from lures -->
      <g fill="none" stroke="#00ffff" stroke-width="1.0" opacity="0.6">
        <path d="M104.7,115 C102,100 95,90 90,80"/>
        <path d="M68,135 C65,120 58,115 50,110"/>
        <path d="M145,142 C150,130 155,120 162,112"/>
      </g>
    </g>

    <!-- Outer trench ripple ring -->
    <circle cx="104.7" cy="145.6" r="95" fill="none" stroke="#028090" stroke-width="1.2" stroke-dasharray="4,8" opacity="0.7"/>
  </g>
</svg>
