<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The Resonant Octave — home: Cadenza. Beings of Pure Sound & Copyrighted Notes.
     Acoustic resonance world: sound wave harmonics, tuning rings, musical oscillation frequencies.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cadenzaCore" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#7209b7"/>
      <stop offset="0.5"  stop-color="#3f37c9"/>
      <stop offset="0.85" stop-color="#1e1a4d"/>
      <stop offset="1"    stop-color="#0f0c29"/>
    </radialGradient>
    <radialGradient id="frequencyHalo" cx="104.7" cy="145.6" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.75" stop-color="#f72585" stop-opacity="0"/>
      <stop offset="1"    stop-color="#f72585" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="soundGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.92">
    <!-- Frequency halo -->
    <circle cx="104.7" cy="145.6" r="98" fill="url(#frequencyHalo)"/>

    <!-- Resonance sphere -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#cadenzaCore)"
            stroke="#b5179e" stroke-width="1.8" stroke-opacity="0.85"/>

    <g clip-path="url(#soundGlobe)">
      <!-- Concentric Harmonic Sound Waves -->
      <circle cx="104.7" cy="145.6" r="72" fill="none" stroke="#4cc9f0" stroke-width="1.4" stroke-opacity="0.6"/>
      <circle cx="104.7" cy="145.6" r="52" fill="none" stroke="#7209b7" stroke-width="1.8" stroke-opacity="0.7"/>
      <circle cx="104.7" cy="145.6" r="32" fill="none" stroke="#f72585" stroke-width="2.2" stroke-opacity="0.8"/>

      <!-- Oscilloscope Waveforms across the sphere -->
      <path d="M12.7,145.6 Q35,115 55,145.6 T95,145.6 T104.7,105 T115,185 T125,145.6 T165,145.6 T196.7,145.6"
            fill="none" stroke="#4cc9f0" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

      <path d="M12.7,120 Q45,100 75,120 T135,120 T196.7,120"
            fill="none" stroke="#f72585" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

      <path d="M12.7,170 Q45,190 75,170 T135,170 T196.7,170"
            fill="none" stroke="#f72585" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

      <!-- Central Acoustic Tuning Node -->
      <circle cx="104.7" cy="145.6" r="14" fill="#f72585" opacity="0.85"/>
      <circle cx="104.7" cy="145.6" r="7"  fill="#ffffff"/>

      <!-- Tuning Fork / Clef accents -->
      <g fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8">
        <path d="M96,135 L96,155 Q96,162 104.7,162 Q113.4,162 113.4,155 L113.4,135"/>
        <path d="M104.7,162 L104.7,172"/>
      </g>
    </g>

    <!-- Radial Audio Spoke Markers -->
    <g stroke="#4cc9f0" stroke-width="1.4" opacity="0.6">
      <line x1="104.7" y1="45" x2="104.7" y2="53"/>
      <line x1="104.7" y1="238" x2="104.7" y2="246"/>
      <line x1="4" y1="145.6" x2="12" y2="145.6"/>
      <line x1="197" y1="145.6" x2="205" y2="145.6"/>
    </g>
  </g>
</svg>
