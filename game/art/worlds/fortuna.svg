<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The House of Luck — home: Fortuna Prime. Casino Dynasts & Probability Arbitrage.
     Casino roulette world: emerald felt, gold payout rays, rotating roulette wheel ring, rolling dice constellation.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="feltGreen" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#2d6a4f"/>
      <stop offset="0.6"  stop-color="#1b4332"/>
      <stop offset="1"    stop-color="#081c15"/>
    </radialGradient>
    <radialGradient id="jackpotGlow" cx="104.7" cy="145.6" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.8"  stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ffd700" stop-opacity="0.6"/>
    </radialGradient>
    <clipPath id="casinoGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.94">
    <!-- Golden jackpot halo -->
    <circle cx="104.7" cy="145.6" r="98" fill="url(#jackpotGlow)"/>

    <!-- Casino felt globe body -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#feltGreen)"
            stroke="#ffd700" stroke-width="2.2" stroke-opacity="0.9"/>

    <g clip-path="url(#casinoGlobe)">
      <!-- Golden Roulette Wheel Hub & Spoke Rays -->
      <g stroke="#ffd700" stroke-width="1.6" opacity="0.75">
        <line x1="104.7" y1="53.6" x2="104.7" y2="237.6"/>
        <line x1="12.7" y1="145.6" x2="196.7" y2="145.6"/>
        <line x1="39.6" y1="80.6" x2="169.7" y2="210.6"/>
        <line x1="39.6" y1="210.6" x2="169.7" y2="80.6"/>
      </g>

      <!-- Alternating Red and Black Sector Pockets -->
      <circle cx="104.7" cy="145.6" r="65" fill="none" stroke="#d90429" stroke-width="12" stroke-dasharray="14,14" opacity="0.85"/>
      <circle cx="104.7" cy="145.6" r="65" fill="none" stroke="#111111" stroke-width="12" stroke-dasharray="14,14" stroke-dashoffset="14" opacity="0.85"/>

      <!-- Inner Brass Wheel Turret -->
      <circle cx="104.7" cy="145.6" r="32" fill="#d4af37" stroke="#fff" stroke-width="1.8"/>
      <circle cx="104.7" cy="145.6" r="16" fill="#081c15" stroke="#ffd700" stroke-width="1.4"/>
      <circle cx="104.7" cy="145.6" r="6"  fill="#ffd700"/>

      <!-- Golden Casino Dice Pair in Upper Corner -->
      <!-- Die 1 -->
      <rect x="52" y="95" width="22" height="22" rx="3" fill="#ffffff" stroke="#d90429" stroke-width="1.4"/>
      <circle cx="63" cy="106" r="2.2" fill="#d90429"/>
      <circle cx="58" cy="101" r="1.6" fill="#111111"/>
      <circle cx="68" cy="111" r="1.6" fill="#111111"/>
      <!-- Die 2 -->
      <rect x="135" y="175" width="22" height="22" rx="3" fill="#ffd700" stroke="#111111" stroke-width="1.4"/>
      <circle cx="140" cy="180" r="1.8" fill="#111111"/>
      <circle cx="152" cy="180" r="1.8" fill="#111111"/>
      <circle cx="146" cy="186" r="1.8" fill="#111111"/>
      <circle cx="140" cy="192" r="1.8" fill="#111111"/>
      <circle cx="152" cy="192" r="1.8" fill="#111111"/>
    </g>

    <!-- Outer Casino Chip Knurl Ring -->
    <circle cx="104.7" cy="145.6" r="95" fill="none" stroke="#ffd700" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.85"/>
  </g>
</svg>
