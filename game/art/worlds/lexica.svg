<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The Glossolalia Lyceum — home: Lexica. Philologists & Billable Grammar.
     Scholarly archive world: parchment rings, Greek glyphs (λόγος, Ω, Ψ, Δ), concentric script bands.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lexicaCore" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#e9d8a6"/>
      <stop offset="0.4"  stop-color="#0a9396"/>
      <stop offset="0.8"  stop-color="#005f73"/>
      <stop offset="1"    stop-color="#001219"/>
    </radialGradient>
    <radialGradient id="scrollHalo" cx="104.7" cy="145.6" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.8"  stop-color="#94d2bd" stop-opacity="0"/>
      <stop offset="1"    stop-color="#94d2bd" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="lexicaGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.92">
    <!-- Script halo -->
    <circle cx="104.7" cy="145.6" r="98" fill="url(#scrollHalo)"/>

    <!-- Library globe body -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#lexicaCore)"
            stroke="#e9d8a6" stroke-width="1.8" stroke-opacity="0.9"/>

    <g clip-path="url(#lexicaGlobe)">
      <!-- Concentric Astrolabe / Text Archive Rings -->
      <circle cx="104.7" cy="145.6" r="70" fill="none" stroke="#e9d8a6" stroke-width="1.4" opacity="0.6"/>
      <circle cx="104.7" cy="145.6" r="46" fill="none" stroke="#ee9b00" stroke-width="1.6" stroke-dasharray="4,4" opacity="0.8"/>

      <!-- Center Open Codex Book & Quill -->
      <g fill="#e9d8a6" stroke="#001219" stroke-width="1.2">
        <path d="M78,145.6 C88,140 98,142 104.7,148 C111,142 121,140 131,145.6 L131,165 C121,160 111,162 104.7,167 C98,162 88,160 78,165 Z"/>
      </g>
      <!-- Center Book Spine & Bookmark -->
      <line x1="104.7" y1="148" x2="104.7" y2="167" stroke="#ee9b00" stroke-width="1.6"/>
      <path d="M104.7,167 L104.7,175 L108,172 L111,175 L111,164" fill="#ca6702"/>

      <!-- Scholarly Greek Glyphs around the rings -->
      <g fill="#e9d8a6" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle" opacity="0.85">
        <text x="104.7" y="100">Λ</text>
        <text x="104.7" y="210">Ω</text>
        <text x="50" y="150">Ψ</text>
        <text x="160" y="150">Δ</text>
        <text x="65" y="110">Σ</text>
        <text x="145" y="110">Φ</text>
        <text x="65" y="190">Θ</text>
        <text x="145" y="190">Ξ</text>
      </g>
    </g>

    <!-- Outer Quill Meridian Ring -->
    <ellipse cx="104.7" cy="145.6" rx="96" ry="32" fill="none"
             stroke="#ee9b00" stroke-width="1.4" stroke-dasharray="16,8"
             transform="rotate(45,104.7,145.6)" opacity="0.75"/>
  </g>
</svg>
