<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Umbrafex Syndicate — home: Nocturne-9. Shadow Syndicate & Redacted Favors.
     Blackout stealth world: obsidian eclipse core, redacted strike-through bars, violet aura.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nocturneCore" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#2b1a3d"/>
      <stop offset="0.6"  stop-color="#140d1f"/>
      <stop offset="1"    stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="eclipseAura" cx="104.7" cy="145.6" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.82" stop-color="#9d4edd" stop-opacity="0"/>
      <stop offset="1"    stop-color="#c77dff" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="shadowGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.94">
    <!-- Violet Eclipse Glow -->
    <circle cx="104.7" cy="145.6" r="98" fill="url(#eclipseAura)"/>

    <!-- Obsidian Globe Body -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#nocturneCore)"
            stroke="#9d4edd" stroke-width="1.8" stroke-opacity="0.85"/>

    <g clip-path="url(#shadowGlobe)">
      <!-- Redacted Strike-Through Blocks (The Classified Syndicate Bars) -->
      <g fill="#000000" stroke="#7b2cbf" stroke-width="1.2">
        <rect x="25" y="95" width="160" height="14" rx="2"/>
        <rect x="40" y="125" width="130" height="16" rx="2" fill="#140d1f" stroke="#c77dff" stroke-width="1.6"/>
        <rect x="15" y="155" width="180" height="14" rx="2"/>
        <rect x="50" y="185" width="110" height="12" rx="2"/>
      </g>

      <!-- Classified [REDACTED] Symbol in center bar -->
      <g fill="#c77dff" opacity="0.9">
        <circle cx="75" cy="133" r="3"/>
        <circle cx="90" cy="133" r="3"/>
        <circle cx="104.7" cy="133" r="3"/>
        <circle cx="120" cy="133" r="3"/>
        <circle cx="135" cy="133" r="3"/>
      </g>

      <!-- Shadow geometric facets -->
      <g fill="none" stroke="#5a189a" stroke-width="1.0" opacity="0.5">
        <polygon points="104.7,53.6 150,100 104.7,145.6 60,100"/>
        <polygon points="104.7,145.6 150,190 104.7,237.6 60,190"/>
      </g>
    </g>

    <!-- Outer stealth ring -->
    <ellipse cx="104.7" cy="145.6" rx="96" ry="40" fill="none"
             stroke="#c77dff" stroke-width="1.4" stroke-dasharray="14,6"
             transform="rotate(35,104.7,145.6)" opacity="0.7"/>
  </g>
</svg>
