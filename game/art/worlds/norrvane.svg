<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Norrvane Frostholm — home: Norrvane. Ice Giants & Rune-Carved Glaciers.
     Frozen permafrost world: glacier crevasses, glowing cyan Elder Futhark runes, polar aurora.
     Same canvas/centre as earth.svg (circle at 104.7,145.6). -->
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glacialIce" cx="104.7" cy="145.6" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#e0fbfc"/>
      <stop offset="0.4"  stop-color="#98c1d9"/>
      <stop offset="0.8"  stop-color="#3d5a80"/>
      <stop offset="1"    stop-color="#1d2d44"/>
    </radialGradient>
    <radialGradient id="auroraHalo" cx="104.7" cy="65" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#80ffdb" stop-opacity="0.6"/>
      <stop offset="0.7"  stop-color="#48bfe3" stop-opacity="0.2"/>
      <stop offset="1"    stop-color="#5390d9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frostGlobe"><circle cx="104.7" cy="145.6" r="92"/></clipPath>
  </defs>

  <g opacity="0.92">
    <!-- Polar Aurora Halo at the top -->
    <ellipse cx="104.7" cy="65" rx="80" ry="25" fill="url(#auroraHalo)"/>

    <!-- Ice Globe Body -->
    <circle cx="104.7" cy="145.6" r="92" fill="url(#glacialIce)"
            stroke="#e0fbfc" stroke-width="1.8" stroke-opacity="0.9"/>

    <g clip-path="url(#frostGlobe)">
      <!-- Jagged Glacier Crags -->
      <path d="M12.7,145.6 L45,115 L70,140 L104.7,95 L140,150 L165,120 L196.7,145.6 L196.7,237.6 L12.7,237.6 Z"
            fill="#293241" opacity="0.75"/>
      <path d="M12.7,185.6 L55,160 L85,190 L104.7,155 L135,200 L170,165 L196.7,185.6 L196.7,237.6 L12.7,237.6 Z"
            fill="#1d2d44"/>

      <!-- Glowing Cyan Runes (Fehu, Isa, Algiz, Sowilo) -->
      <g stroke="#80ffdb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
        <!-- Fehu ᚠ in center -->
        <path d="M104.7,125 L104.7,165 M104.7,135 L118,125 M104.7,148 L118,138"/>
        <!-- Isa ᛁ left -->
        <path d="M68,130 L68,160"/>
        <!-- Algiz ᛉ right -->
        <path d="M142,130 L142,160 M142,142 L132,130 M142,142 L152,130"/>
        <!-- Sowilo ᛊ bottom -->
        <path d="M96,182 L105,188 L103,196 L112,202"/>
      </g>

      <!-- Frost Crystal Shards -->
      <g fill="#ffffff" opacity="0.7">
        <polygon points="104.7,65 107,75 104.7,85 102.4,75"/>
        <polygon points="65,95 72,100 65,108 58,100"/>
        <polygon points="145,95 152,100 145,108 138,100"/>
      </g>
    </g>

    <!-- Outer Frost Crystal Ring -->
    <circle cx="104.7" cy="145.6" r="96" fill="none" stroke="#80ffdb" stroke-width="1.2" stroke-dasharray="12,6" opacity="0.6"/>
  </g>
</svg>
